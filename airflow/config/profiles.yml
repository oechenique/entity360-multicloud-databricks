# Perfil de dbt dentro de Airflow (Cosmos): SP entity360-orquestador con OAuth M2M (ADR 0007).
# Sin secretos: todo sale de variables de entorno del container.
entity360:
  target: airflow
  outputs:
    airflow:
      type: databricks
      catalog: entity360
      schema: gold
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      threads: 4
    # Marts en Snowflake (fase 9): ENTITY360_DBT_SVC con la clave privada montada (docker-compose.yml).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: ENTITY360_DBT_SVC
      private_key_path: "{{ env_var('SNOWFLAKE_DBT_KEY_PATH') }}"
      role: ENTITY360_DBT
      warehouse: ENTITY360_WH
      database: ENTITY360_MARTS
      schema: MARTS
      threads: 4
