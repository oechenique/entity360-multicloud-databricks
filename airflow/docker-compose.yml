# Fase 8 (regla 10): Airflow local como plano de control. Local por decisión de costo.
# Levantar con airflow\levantar.ps1: lee las credenciales del llavero de Windows y las pasa como
# variables de entorno (ADR 0007). `docker compose` directo falla sin ellas (`:?`).
# UI: http://localhost:8080 (solo localhost; todos los usuarios son admin, uso local).
#
# Stack liviano (2026-09-29): la primera corrida del DAG saturó la CPU de la PC. LocalExecutor (las tareas,
# dbt incluido, corren como procesos del scheduler), sin triggerer (ninguna tarea es diferible: los
# sensores usan mode=reschedule), a lo sumo 4 tareas a la vez, el DAG se reparsea cada 5 min y cada
# container tiene techo de CPU y memoria. Medición: airflow/evidencia/consumo.md.
name: entity360-airflow

x-airflow: &airflow
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: entity360-airflow:3.3.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Argentina/Buenos_Aires
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${E360_JWT_SECRET:?correr airflow\levantar.ps1}
    # Concurrencia: por defecto 32 tareas (16 por DAG). Con 4, dbt corre de a cuatro modelos o tests.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    # Parseo: un solo proceso, y cada 5 min (por defecto 2 procesos, cada 30 s). Cosmos hashea la
    # carpeta de dbt en cada parseo; un DAG que cambia poco no necesita más.
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "300"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "300"
    AIRFLOW__API__WORKERS: "1"
    # Cosmos corre `dbt ls` al parsear el DAG (sobre un bind mount de Windows): 30 s no alcanzan.
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "180"
    # Databricks: SP entity360-orquestador (OAuth M2M). Conexión para DatabricksRunNowOperator,
    # variables DATABRICKS_* para los contratos (databricks-sdk) y el perfil de dbt.
    AIRFLOW_CONN_DATABRICKS_DEFAULT: >-
      {"conn_type": "databricks", "host": "${E360_DATABRICKS_HOST:?}", "login": "${E360_ORQ_CLIENT_ID:?}",
       "password": "${E360_ORQ_CLIENT_SECRET:?}", "extra": {"service_principal_oauth": true}}
    DATABRICKS_HOST: ${E360_DATABRICKS_HOST:?}
    DATABRICKS_CLIENT_ID: ${E360_ORQ_CLIENT_ID:?}
    DATABRICKS_CLIENT_SECRET: ${E360_ORQ_CLIENT_SECRET:?}
    DATABRICKS_HTTP_PATH: ${E360_WAREHOUSE_HTTP_PATH:?}
    E360_MEDALLION_JOB_ID: ${E360_MEDALLION_JOB_ID:?}
    # dbt deja Gold a nombre del SP (dbt/macros/duenio_gold.sql): en Airflow es el mismo SP.
    E360_GOLD_OWNER: ${E360_ORQ_CLIENT_ID:?}
    # Extractor CDC: su propio SP (ADR 0002) y el login de solo lectura del SQL Server del legacy.
    CDC_DATABRICKS_HOST: ${CDC_DATABRICKS_HOST:?}
    CDC_DATABRICKS_CLIENT_ID: ${CDC_DATABRICKS_CLIENT_ID:?}
    CDC_DATABRICKS_SECRET: ${CDC_DATABRICKS_SECRET:?}
    CDC_SQL_PASSWORD: ${CDC_SQL_PASSWORD:?}
    CDC_SQL_HOST: entity360-legacy-mssql
    # Alertas (Telegram, opcional): sin estas variables van a stderr (contracts/alertas.py).
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    E360_RAIZ: /opt/entity360
    # Fase 9: tareas de Snowflake del DAG. Claves privadas de ~/.snowflake/keys, montadas de solo lectura.
    SNOWFLAKE_ACCOUNT: ${E360_SNOWFLAKE_ACCOUNT:?correr airflow\levantar.ps1 (snowflake/cuenta.py conexiones)}
    SNOWFLAKE_SYNC_USER: ENTITY360_SYNC_SVC
    SNOWFLAKE_SYNC_KEY_PATH: /opt/entity360/snowflake_keys/entity360_sync_svc.p8
    SNOWFLAKE_DBT_KEY_PATH: /opt/entity360/snowflake_keys/entity360_dbt_svc.p8
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/entity360/airflow_config:ro
    - ../dbt:/opt/entity360/dbt
    - ../contracts:/opt/entity360/contracts:ro
    # rw: el checkpoint del LSN (state/) es el mismo que usa el extractor corrido a mano en la PC.
    - ../producers/cdc_extractor:/opt/entity360/cdc_extractor
    - ../snowflake:/opt/entity360/snowflake:ro
    - ${USERPROFILE}/.snowflake/keys:/opt/entity360/snowflake_keys:ro
  # Tapa los entornos y artefactos de Windows que viven dentro de los proyectos montados: Cosmos hashea
  # la carpeta de dbt en cada parseo y el .venv tiene miles de archivos.
  tmpfs:
    - /opt/entity360/dbt/.venv
    - /opt/entity360/dbt/target
    - /opt/entity360/dbt/logs
    - /opt/entity360/contracts/.venv
  networks: [default, legacy]
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    cpus: 0.5
    mem_limit: 384m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow # solo en la red interna de compose, sin puerto publicado
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    cpus: 1.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    cpus: 1.0
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
    restart: unless-stopped

  # Con LocalExecutor el scheduler ejecuta las tareas: dbt, Soda, el extractor CDC. El techo más alto.
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    cpus: 2.0
    mem_limit: 2g
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres-db:

networks:
  # La red del SQL Server del legacy (legacy/docker-compose.yml): el extractor CDC lo ve por nombre.
  legacy:
    name: entity360-legacy_default
    external: true
