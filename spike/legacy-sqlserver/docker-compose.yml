# Spike B.7: SQL Server "legacy" on-prem con CDC.
# Developer (no Express): el CDC necesita el SQL Server Agent.
name: entity360-spike-legacy

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: entity360-spike-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?definir MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:1433:1433" # solo localhost
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mssql-data:
    name: entity360-spike-mssql
