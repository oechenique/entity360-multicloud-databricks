# Fase 7 (regla 09): Gold con contratos enforced sobre Silver y la resolución de identidades.
name: entity360
version: "1.0.0"
profile: entity360
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Fase 10: cada invocación deja sus resultados en ops.dbt_resultado (panel de salud del dashboard).
on-run-end:
  - "{{ registrar_resultados(results) }}"

# Dos plataformas, un proyecto (fase 9, docs/fase9-plan.md §4): Gold se construye solo en Databricks
# (target databricks o airflow) y los marts solo en Snowflake (target snowflake). Cosmos renderiza con el
# target airflow: el DAG no ve los marts.
models:
  entity360:
    gold:
      +enabled: "{{ target.type == 'databricks' }}"
      # Incremental con insert_overwrite y sin particiones: cada corrida reescribe todo el contenido con
      # INSERT OVERWRITE sobre la misma tabla. Con `table`, dbt hace CREATE OR REPLACE, el UUID de la tabla
      # Iceberg cambia y Snowflake programa el DROP de la tabla vinculada (093680). Un cambio de columnas
      # falla (on_schema_change) y pide --full-refresh, que sí recrea la tabla: re-vincular en Snowflake.
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +on_schema_change: fail
      +table_format: iceberg     # Camino A de Snowflake (regla 11): Gold se lee por Iceberg REST
      +contract:
        enforced: true
      +tags: ["gold"]
      +databricks_tags:
        capa: gold
      +persist_docs:          # descripciones como comentarios en Unity Catalog (las usa Genie)
        relation: true
        columns: true
      +pre-hook: "{{ exigir_duenio_gold() }}"
      # Primero el contrato (el dueño actual lo aplica); al final, la tabla pasa al SP del orquestador.
      +post-hook:
        - "{{ aplicar_contrato_iceberg() }}"
        - "{{ asignar_duenio_gold() }}"

    marts:
      +enabled: "{{ target.type == 'snowflake' }}"
      +materialized: table
      +tags: ["marts"]

flags:
  # table_format: iceberg sin este flag crea Delta con UniForm. Con el flag, Iceberg gestionado, como
  # Silver y la resolución (ADR 0004) y lo que validó el spike para Snowflake (3b, 4e).
  use_managed_iceberg: true
