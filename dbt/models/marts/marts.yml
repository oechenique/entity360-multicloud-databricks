version: 2

# Marts para los modelers en Snowflake (fase 9, regla 11). Solo se construyen con el target snowflake.

models:
  - name: mart_empresa
    description: >
      Una fila por empresa del golden record con identidad, cantidad de fuentes, noticias de los últimos
      30 días, riesgo y cambios del legacy de los últimos 90 días.
    columns:
      - name: entity_id
        description: Identificador estable de la empresa (el de Gold).
        data_tests: [unique, not_null]
      - name: nombre
        data_tests: [not_null]
      - name: fuentes
        description: Cantidad de fuentes de las que sale la empresa.
        data_tests:
          - rango: {arguments: {min: 1}}
      - name: tono_30d
        description: Tono promedio de la cobertura de 30 días, ponderado por menciones (-100 a 100).
        data_tests:
          - rango: {arguments: {min: -100, max: 100}}

  - name: mart_noticias_diarias
    description: Menciones por empresa y día con la media móvil de 7 días. Datos de The GDELT Project.
    data_tests:
      - combinacion_unica: {arguments: {columnas: [entity_id, fecha]}}
    columns:
      - name: entity_id
        data_tests:
          - relationships: {arguments: {to: ref('mart_empresa'), field: entity_id}}

  - name: mart_riesgo
    description: Apariciones en listas de riesgo de OpenSanctions (CC BY-NC 4.0), con el contexto de la empresa.
    data_tests:
      - combinacion_unica: {arguments: {columnas: [entity_id, opensanctions_id]}}
    columns:
      - name: entity_id
        data_tests:
          - relationships: {arguments: {to: ref('mart_empresa'), field: entity_id}}
