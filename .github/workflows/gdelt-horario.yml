# Fase 4 (regla 06, ADR 0003): productor GDELT en GitHub Actions, sin facturación en GCP.
# Paso 0: solo verificación de Workload Identity Federation (auth OIDC -> SA por impersonación ->
# dry run en BigQuery sandbox). El extractor completo y el cron llegan en la etapa siguiente.
name: gdelt-horario

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # token OIDC de GitHub para el intercambio con GCP (sin claves de SA)

jobs:
  verificar-wif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enmascarar el proyecto
        run: echo "::add-mask::${{ secrets.GCP_PROJECT_ID }}"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Identidad y dry run de GKG con filtro de partición
        env:
          PROYECTO: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$PROYECTO" --quiet
          gcloud auth list --filter=status:ACTIVE --format="value(account)" | sed 's/@.*/@<SA>/'
          bq --location=US query --dry_run --use_legacy_sql=false \
            "SELECT GKGRECORDID, V2Organizations FROM \`gdelt-bq.gdeltv2.gkg_partitioned\`
             WHERE _PARTITIONTIME = TIMESTAMP(CURRENT_DATE())"
